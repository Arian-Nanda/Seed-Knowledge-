<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Seed Explorer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1b1f24;
    color: #e6e6e6;
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #9aa0a6;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #3a3f45;
    background: #262b31;
    color: #e6e6e6;
  }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    border-radius: 6px;
    border: none;
    background: #4c8f4c;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #5aa55a; }
  button:disabled { background: #3a3f45; cursor: default; }

  .coords-row {
    margin-bottom: 20px;
  }
  .coords-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #9aa0a6;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .coords-inputs {
    display: flex;
    gap: 8px;
  }
  .coords-inputs input {
    flex: 1;
    padding: 8px 12px;
    font-size: 0.95rem;
    border-radius: 6px;
    border: 1px solid #3a3f45;
    background: #262b31;
    color: #e6e6e6;
  }

  #error {
    color: #ff8080;
    margin-bottom: 16px;
    display: none;
  }

  #results { display: none; }

  .spawn-box {
    background: #262b31;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid #33383e;
  }
  th { color: #9aa0a6; font-weight: normal; font-size: 0.85rem; }
  td.coords { font-variant-numeric: tabular-nums; }
  td.none { color: #6b7178; font-style: italic; }
</style>
</head>
<body>

<h1>Minecraft Seed Explorer</h1>
<p class="subtitle">Enter a seed to see spawn point and nearby structures (Minecraft 1.21).</p>

<div class="search-row">
  <input type="text" id="seedInput" placeholder="Enter a seed, e.g. 12345">
  <button id="searchBtn">Search</button>
</div>

<div class="coords-row">
  <label class="coords-toggle">
    <input type="checkbox" id="useCoordsCheckbox">
    Search from a specific location instead of spawn
  </label>
  <div class="coords-inputs" id="coordsInputs" style="display:none;">
    <input type="text" id="xInput" placeholder="X coordinate">
    <input type="text" id="zInput" placeholder="Z coordinate">
  </div>
</div>

<div id="error"></div>

<div id="results">
  <div class="spawn-box">
    <strong>Spawn point:</strong> <span id="spawnCoords"></span>
  </div>
  <table>
    <thead>
      <tr><th>Structure</th><th>Coordinates</th></tr>
    </thead>
    <tbody id="structureRows"></tbody>
  </table>
</div>

<script>
const seedInput = document.getElementById("seedInput");
const searchBtn = document.getElementById("searchBtn");
const errorBox = document.getElementById("error");
const resultsBox = document.getElementById("results");
const spawnCoords = document.getElementById("spawnCoords");
const structureRows = document.getElementById("structureRows");
const useCoordsCheckbox = document.getElementById("useCoordsCheckbox");
const coordsInputs = document.getElementById("coordsInputs");
const xInput = document.getElementById("xInput");
const zInput = document.getElementById("zInput");

useCoordsCheckbox.addEventListener("change", () => {
  coordsInputs.style.display = useCoordsCheckbox.checked ? "flex" : "none";
});

const STRUCTURE_LABELS = {
  village: "Village",
  desertPyramid: "Desert Pyramid",
  jungleTemple: "Jungle Temple",
  swampHut: "Swamp Hut",
  igloo: "Igloo",
  oceanRuin: "Ocean Ruin",
  shipwreck: "Shipwreck",
  oceanMonument: "Ocean Monument",
  woodlandMansion: "Woodland Mansion",
  pillagerOutpost: "Pillager Outpost",
  ruinedPortal: "Ruined Portal",
  ancientCity: "Ancient City",
  mineshaft: "Mineshaft",
  trailRuins: "Trail Ruins",
  trialChambers: "Trial Chambers",
  netherFortress: "Nether Fortress",
  bastionRemnant: "Bastion Remnant",
  ruinedPortalNether: "Ruined Portal (Nether)",
  endCity: "End City",
};

async function runSearch() {
  const seed = seedInput.value.trim();
  errorBox.style.display = "none";
  resultsBox.style.display = "none";

  if (seed === "") {
    showError("Please enter a seed.");
    return;
  }

  let url = `/api/seed/${encodeURIComponent(seed)}`;

  if (useCoordsCheckbox.checked) {
    const x = xInput.value.trim();
    const z = zInput.value.trim();
    if (x === "" || z === "") {
      showError("Please enter both X and Z coordinates, or uncheck the location option.");
      return;
    }
    url += `?x=${encodeURIComponent(x)}&z=${encodeURIComponent(z)}`;
  }

  searchBtn.disabled = true;
  searchBtn.textContent = "Searching...";

  try {
    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      showError(data.error || "Something went wrong.");
      return;
    }

    renderResults(data);
  } catch (err) {
    showError("Could not reach the server. Please try again.");
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = "Search";
  }
}

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
}

function renderResults(data) {
  spawnCoords.textContent = `X: ${data.spawn.x}, Z: ${data.spawn.z}`;

  structureRows.innerHTML = "";
  for (const [key, label] of Object.entries(STRUCTURE_LABELS)) {
    const pos = data.structures[key];
    const row = document.createElement("tr");

    const nameCell = document.createElement("td");
    nameCell.textContent = label;

    const coordsCell = document.createElement("td");
    if (pos) {
      const distanceText = pos.distance !== undefined ? ` (${Math.round(pos.distance)} blocks away)` : "";
      coordsCell.textContent = `X: ${pos.x}, Z: ${pos.z}${distanceText}`;
      coordsCell.className = "coords";
    } else {
      coordsCell.textContent = "Not found nearby";
      coordsCell.className = "none";
    }

    row.appendChild(nameCell);
    row.appendChild(coordsCell);
    structureRows.appendChild(row);
  }

  resultsBox.style.display = "block";
}

searchBtn.addEventListener("click", runSearch);
seedInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") runSearch();
});
</script>

</body>
</html>
